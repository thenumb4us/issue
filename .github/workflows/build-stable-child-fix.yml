name: Build stable child login fix

on:
  push:
    branches:
      - backup/stable-child-login-fix-2026-09-25
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Remove Termux-only Gradle overrides
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ISSUE-stable-child-login-fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ISSUE-stable-child-login-fix
          path: ISSUE-stable-child-login-fix.apk
          if-no-files-found: error
